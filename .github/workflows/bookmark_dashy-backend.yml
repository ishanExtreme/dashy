# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Dashy Node.js backend to Azure Web App

on:
  push:
    branches:
      - bookmark
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Setup Yarn
        run: npm install -g yarn

      - name: Install dependencies with Yarn
        run: |
          yarn install --ignore-engines --immutable --no-cache --network-timeout 300000 --network-concurrency 1

      - name: Build Dashy frontend
        run: |
          yarn build

      - name: Create deployment package
        run: |
          # Create a clean directory for deployment
          mkdir -p deploy-package
          
          # Copy essential files for the Node.js server
          cp package.json deploy-package/
          cp server.js deploy-package/
          cp -r services/ deploy-package/
          cp -r src/ deploy-package/
          cp -r dist/ deploy-package/
          cp -r public/ deploy-package/
          cp -r user-data/ deploy-package/
          
          # Copy yarn.lock for dependency resolution
          cp yarn.lock deploy-package/
          
          # Copy any additional config files that might be needed
          [ -f .env ] && cp .env deploy-package/ || true
          [ -f vue.config.js ] && cp vue.config.js deploy-package/ || true

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dashy-backend-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dashy-backend-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dashy-backend'
          slot-name: 'Production'
          package: .